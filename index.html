<h1>Student Management System - Contact Us</h1>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Student Management System</h1>
        <p>Manage student records easily</p>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Add New Student</h2>

            <form id="studentForm">
                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId"
                           placeholder="Enter student ID" required>
                </div>

                <div class="form-group">
                    <label for="studentName">Full Name</label>
                    <input type="text" id="studentName"
                           placeholder="Enter full name" required>
                </div>

                <div class="form-group">
                    <label for="studentEmail">Email Address</label>
                    <input type="email" id="studentEmail"
                           placeholder="Enter email" required>
                </div>

                <div class="form-group">
                    <label for="studentPhone">Phone Number</label>
                    <input type="tel" id="studentPhone"
                           placeholder="Enter phone number"
                           pattern="[0-9]{10}" maxlength="10" required>
                </div>

                <div class="form-group">
                    <label for="studentCourse">Course</label>
                    <select id="studentCourse" required>
                        <option value="">Select Course</option>
                        <option value="BSc Computer Science">BSc Computer Science</option>
                        <option value="BCA">BCA</option>
                        <option value="BBA">BBA</option>
                        <option value="BCom">BCom</option>
                        <option value="BA">BA</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="studentCity">City</label>
                    <input type="text" id="studentCity"
                           placeholder="Enter city" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Add Student
                </button>
            </form>
        </section>

        <section class="list-section">
            <h2>Student Records</h2>

            <div class="summary">
                Total Students: <span id="totalStudents">0</span>
            </div>

            <input type="search" id="searchInput"
                   class="search-box"
                   placeholder="Search by name, ID, course or city...">

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Course</th>
                            <th>City</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                        <!-- Student records appear here -->
                    </tbody>
                </table>
            </div>

            <p id="emptyMessage" class="empty-message">
                No student records found.
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Student Management System</p>
    </footer>

    <script>
        const studentForm = document.getElementById("studentForm");
        const studentTableBody = document.getElementById("studentTableBody");
        const searchInput = document.getElementById("searchInput");
        const totalStudents = document.getElementById("totalStudents");
        const emptyMessage = document.getElementById("emptyMessage");

        // Load saved students from browser storage
        let students = JSON.parse(
            localStorage.getItem("students") || "[]"
        );

        function saveStudents() {
            localStorage.setItem("students", JSON.stringify(students));
        }

        function renderStudents(searchTerm = "") {
            studentTableBody.replaceChildren();

            const term = searchTerm.trim().toLowerCase();

            const filteredStudents = students.filter(student =>
                [
                    student.id,
                    student.name,
                    student.email,
                    student.phone,
                    student.course,
                    student.city
                ].some(value => value.toLowerCase().includes(term))
            );

            totalStudents.textContent = students.length;
            emptyMessage.style.display =
                filteredStudents.length === 0 ? "block" : "none";

            filteredStudents.forEach(student => {
                const row = document.createElement("tr");

                [
                    student.id,
                    student.name,
                    student.email,
                    student.phone,
                    student.course,
                    student.city
                ].forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                const actionCell = document.createElement("td");
                const deleteButton = document.createElement("button");

                deleteButton.textContent = "Delete";
                deleteButton.className = "btn btn-danger";
                deleteButton.type = "button";

                deleteButton.addEventListener("click", () => {
                    const confirmed = confirm(
                        "Are you sure you want to delete this student?"
                    );

                    if (confirmed) {
                        students = students.filter(
                            item => item.id !== student.id
                        );
                        saveStudents();
                        renderStudents(searchInput.value);
                    }
                });

                actionCell.appendChild(deleteButton);
                row.appendChild(actionCell);
                studentTableBody.appendChild(row);
            });
        }

        studentForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const student = {
                id: document.getElementById("studentId").value.trim(),
                name: document.getElementById("studentName").value.trim(),
                email: document.getElementById("studentEmail").value.trim(),
                phone: document.getElementById("studentPhone").value.trim(),
                course: document.getElementById("studentCourse").value,
                city: document.getElementById("studentCity").value.trim()
            };

            // Prevent duplicate student IDs
            const duplicate = students.some(
                item => item.id.toLowerCase() === student.id.toLowerCase()
            );

            if (duplicate) {
                alert("This Student ID already exists!");
                return;
            }

            students.push(student);
            saveStudents();
            renderStudents(searchInput.value);
            studentForm.reset();

            alert("Student added successfully!");
        });

        searchInput.addEventListener("input", function() {
            renderStudents(searchInput.value);
        });

        // Display records when the page opens
        renderStudents();
    </script>
</body>
</html>
